# Every build and CI tool, at an exact version. mise.lock pins each
# tool's sha256 per platform. Bump by hand, then run `mise lock --bump`.
# A Go bump also changes GoVersionOverride in osv-scanner.toml.
min_version = "2026.10.19"

[tools]
go = "1.27.3"
"aqua:goreleaser/goreleaser" = "2.19.0"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:google/osv-scanner" = "2.7.0"
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"

[tool_config]
# Fail an install whose tool has no mise.lock entry for this platform.
locked = true
